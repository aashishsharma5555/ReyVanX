apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal
  namespace: netbird
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal
  template:
    metadata:
      labels:
        app: signal
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: agentpool2
      containers:
        - name: signal
          image: netbirdio/signal:0.62.0
          ports:
            - name: http
              containerPort: 80
            - name: grpc
              containerPort: 10000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 20
