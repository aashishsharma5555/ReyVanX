apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: netbird
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: agentpool2
      containers:
        - name: caddy
          image: caddy:2
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: caddy-config
            items:
              - key: Caddyfile
                path: Caddyfile
