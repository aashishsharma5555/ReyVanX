apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: agentpool2
      containers:
        - name: relay
          image: netbirdio/relay:0.62.0
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: relay-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 20
