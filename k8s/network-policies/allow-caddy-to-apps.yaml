apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-caddy-to-apps
  namespace: netbird
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - dashboard
          - management
          - signal
          - relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: caddy
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 10000
